name: Deploy DEV

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy DEV over SSH
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 20
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 45s
          command_timeout: 18m
          script: |
            set -euo pipefail
            cd /opt/crm-mvp-dev
            ./deploy-dev.sh

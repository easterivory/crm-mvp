name: Deploy DEV

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Configure SSH key
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/dev_key
          chmod 600 ~/.ssh/dev_key

      - name: Deploy DEV over SSH
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          timeout 19m ssh \
            -i ~/.ssh/dev_key \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -o ConnectionAttempts=1 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            'cd /opt/crm-mvp-dev && ./deploy-dev.sh'

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:  
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_PORT}:8000"
    env_file:
      - .env
    environment:
      APP_SERVICE_NAME: api
      LOG_STORAGE_PATH: /app/storage/logs
      BROADCAST_UPLOAD_STORAGE_PATH: /app/storage/broadcast_uploads
      CHAT_ATTACHMENT_STORAGE_PATH: /app/storage/chat_attachments
      TELEGRAM_ACCOUNT_MEDIA_STORAGE_PATH: /app/storage/telegram_account_media
    volumes:
      - ./frontend/dist:/app/frontend/dist:ro
      - landers_data:/app/storage/landers
      - broadcast_uploads_data:/app/storage/broadcast_uploads
      - chat_attachments_data:/app/storage/chat_attachments
      - telegram_account_media_data:/app/storage/telegram_account_media
      - logs_data:/app/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: python -m app.workers
    env_file:
      - .env
    environment:
      APP_SERVICE_NAME: worker
      LOG_STORAGE_PATH: /app/storage/logs
      BROADCAST_UPLOAD_STORAGE_PATH: /app/storage/broadcast_uploads
      CHAT_ATTACHMENT_STORAGE_PATH: /app/storage/chat_attachments
      TELEGRAM_ACCOUNT_MEDIA_STORAGE_PATH: /app/storage/telegram_account_media
    volumes:
      - broadcast_uploads_data:/app/storage/broadcast_uploads
      - chat_attachments_data:/app/storage/chat_attachments
      - telegram_account_media_data:/app/storage/telegram_account_media
      - logs_data:/app/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  jobs:
    build: .
    restart: unless-stopped
    command: arq app.workers.postback_worker.WorkerSettings
    env_file:
      - .env
    environment:
      APP_SERVICE_NAME: jobs
      LOG_STORAGE_PATH: /app/storage/logs
      BROADCAST_UPLOAD_STORAGE_PATH: /app/storage/broadcast_uploads
      CHAT_ATTACHMENT_STORAGE_PATH: /app/storage/chat_attachments
      TELEGRAM_ACCOUNT_MEDIA_STORAGE_PATH: /app/storage/telegram_account_media
    volumes:
      - broadcast_uploads_data:/app/storage/broadcast_uploads
      - chat_attachments_data:/app/storage/chat_attachments
      - telegram_account_media_data:/app/storage/telegram_account_media
      - logs_data:/app/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backup:
    build: .
    restart: unless-stopped
    command: arq app.workers.backup_worker.WorkerSettings
    env_file:
      - .env
    environment:
      APP_SERVICE_NAME: backup
      LOG_STORAGE_PATH: /app/storage/logs
    volumes:
      - backups_data:/backups
      - logs_data:/app/storage/logs
    depends_on:
      postgres:
        condition: service_healthy

  mtproto:
    build: .
    restart: unless-stopped
    command: python -m app.workers mtproto
    env_file:
      - .env
    environment:
      APP_SERVICE_NAME: mtproto
      LOG_STORAGE_PATH: /app/storage/logs
      TELEGRAM_ACCOUNT_MEDIA_STORAGE_PATH: /app/storage/telegram_account_media
    volumes:
      - broadcast_uploads_data:/app/storage/broadcast_uploads
      - chat_attachments_data:/app/storage/chat_attachments
      - telegram_account_media_data:/app/storage/telegram_account_media
      - logs_data:/app/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  backups_data:
  landers_data:
  broadcast_uploads_data:
  chat_attachments_data:
  telegram_account_media_data:
  logs_data:

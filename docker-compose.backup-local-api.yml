# Opt-in override: docker compose -f docker-compose.yml -f docker-compose.backup-local-api.yml ...
x-backup-api: &backup-api
  BACKUP_TELEGRAM_API_BASE_URL: http://backup-telegram-api:8081
  BACKUP_TELEGRAM_MAX_UPLOAD_MB: "2000"
  BACKUP_TELEGRAM_TIMEOUT_SECONDS: "1800"

services:
  backup-telegram-api:
    image: aiogram/telegram-bot-api:10.3@sha256:ed55b69b130bc6baeacbc6c852bf56eb82423c6c652eb97c2bf3ae688f9b34f6
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${BACKUP_LOCAL_API_ID:?Set BACKUP_LOCAL_API_ID}
      TELEGRAM_API_HASH: ${BACKUP_LOCAL_API_HASH:?Set BACKUP_LOCAL_API_HASH}
      TELEGRAM_LOCAL: "1"
      TELEGRAM_VERBOSITY: "1"
    volumes:
      - backup_telegram_api_data:/var/lib/telegram-bot-api
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8081"]
      interval: 10s
      timeout: 3s
      retries: 12
    # No published ports: local mode must not be exposed to the Internet.

  backup:
    environment: *backup-api
    depends_on:
      backup-telegram-api:
        condition: service_healthy
      redis:
        condition: service_healthy

  # These services send operational alerts/logs with the same backup bot.
  # BACKUP_* does not change client, buyer or admin bot API endpoints.
  api:
    environment: *backup-api
  worker:
    environment: *backup-api
  jobs:
    environment: *backup-api
  mtproto:
    environment: *backup-api

volumes:
  backup_telegram_api_data:

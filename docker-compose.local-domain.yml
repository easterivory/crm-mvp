services:

  local_domain_proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${LOCAL_PROXY_PORT:-80}:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./docker/local-domain/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started

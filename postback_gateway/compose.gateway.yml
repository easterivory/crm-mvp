# STANDALONE ONLY. Never combine this file with the CRM compose files.
name: crm-postback-gateway
services:
  gateway:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "127.0.0.1:9080:8080"
    volumes:
      - queue:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  queue:
